<!doctype html>
<html lang="fr" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>La guerre des blocus</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Film interactif en six chapitres sur la guerre Iran–États-Unis, avec l'analyse de Hafid Boutchakkoucht, chercheur en relations internationales, scène par scène.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;700&family=IBM+Plex+Sans+Arabic:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: a screening room. 16:9 stage on the left, the researcher's notebook on the right, a chapter rail under the screen. Single dark look, by choice. */
:root{
  color-scheme:dark;
  --ground:#0b0f14; --ink:#121920; --panel:#18212b; --line:#283440;
  --bone:#efe7d6; --mute:#98a2ad; --dim:#6b7682;
  --stamp:#ff4b35; --civ:#d0442f; --ru:#d9953a; --ua:#5d9fdb; --us:#a3bd8c;
  --f-display:"Reem Kufi","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --f-body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--ground);color:var(--bone)}
body{margin:0;font:400 15px/1.6 var(--f-body);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
a{color:var(--bone)}
:focus-visible{outline:2px solid var(--stamp);outline-offset:2px}
.wrap{max-width:1440px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 28px;display:grid;gap:16px}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.brand{display:grid;gap:2px;min-width:0}
.brand small{font:500 12px/1.2 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--stamp)}
[dir=rtl] .brand small{letter-spacing:0;font-family:var(--f-body);font-weight:700;font-size:13px}
.brand h1{margin:0;font:700 clamp(22px,2.6vw,34px)/1.1 var(--f-display);text-wrap:balance}
.brand span{color:var(--mute);font-size:13px}
.back{font-size:13px;color:var(--mute);text-decoration:none;margin-bottom:4px}.back:hover{color:var(--bone)}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg{display:flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--ink)}
.seg button{border:0;background:none;padding:6px 14px;border-radius:999px;cursor:pointer;font-weight:500;font-size:14px;color:var(--mute)}
.seg button[aria-pressed=true]{background:var(--bone);color:var(--ground)}
.tbtn{border:1px solid var(--line);background:var(--ink);border-radius:999px;padding:7px 14px;cursor:pointer;font-size:14px;display:inline-flex;gap:8px;align-items:center}
.tbtn:hover{border-color:var(--mute)}
.tbtn svg{width:16px;height:16px}

/* main grid */
.main{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px;align-items:start}
@media (max-width:1020px){.main{grid-template-columns:minmax(0,1fr)}}
.player{display:grid;gap:10px;min-width:0}

/* stage */
.stage{width:100%;max-width:100%;container-type:inline-size}
.screen{position:relative;width:100%;aspect-ratio:16/9;background:var(--ink);border:1px solid var(--line);border-radius:6px;overflow:hidden;isolation:isolate}
.stage:fullscreen{display:grid;place-items:center;background:var(--ground)}.stage:fullscreen .screen{max-height:100vh;width:auto;height:100%;max-width:100%}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;z-index:0}
.grain{position:absolute;inset:0;z-index:1;pointer-events:none;background-image:linear-gradient(rgba(152,162,173,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(152,162,173,.05) 1px,transparent 1px);background-size:4cqw 4cqw}
.mast{position:absolute;top:2.2cqw;right:2.4cqw;z-index:6;display:flex;align-items:center;gap:1.1cqw;direction:ltr}
.mast .who{display:grid;text-align:right;line-height:1.2}
.mast b{font:700 1.45cqw var(--f-display)}
.mast i{font-style:normal;font-size:1.05cqw;color:var(--mute)}
.mast img{width:4.6cqw;height:4.6cqw;border-radius:50%;object-fit:cover;object-position:50% 15%;border:2px solid var(--stamp);box-shadow:0 0 0 .35cqw var(--ground)}
.chtag{position:absolute;top:2.4cqw;left:2.6cqw;z-index:6;font:500 1.05cqw/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--mute);display:flex;gap:.8cqw;align-items:center}
[dir=rtl] .chtag{font-family:var(--f-body);letter-spacing:0;font-size:1.2cqw}
.chtag b{color:var(--stamp);font-weight:500}
.scene{position:absolute;inset:0;z-index:4;padding:8cqw 6cqw 6.4cqw;display:flex;flex-direction:column;justify-content:center;gap:1.8cqw}
.srcline{position:absolute;z-index:6;bottom:1.6cqw;inset-inline-start:2.6cqw;inset-inline-end:2.6cqw;font-size:1cqw;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd{margin:0;font:700 3.3cqw/1.15 var(--f-display);text-wrap:balance;max-width:70cqw}
.kick{font:500 1.35cqw/1.3 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--stamp)}
[dir=rtl] .kick{font-family:var(--f-body);font-weight:700;letter-spacing:0;font-size:1.6cqw}
.sub{font-size:1.75cqw;line-height:1.5;color:var(--bone);max-width:62cqw;opacity:.92}
.stamp{position:absolute;z-index:5;bottom:9cqw;inset-inline-end:6cqw;transform:rotate(-8deg);font:700 2cqw/1.05 var(--f-display);color:var(--stamp);border:.35cqw solid var(--stamp);border-radius:.7cqw;padding:.6cqw 1.4cqw;text-align:center;background:rgba(11,15,20,.82);box-shadow:inset 0 0 0 .25cqw rgba(11,15,20,.9),inset 0 0 0 .45cqw var(--stamp);animation:stamp .5s cubic-bezier(.2,1.6,.4,1) both;animation-delay:var(--sd,1.4s)}
.stamp small{display:block;font:700 .95cqw var(--f-body);letter-spacing:.1em;margin-top:.3cqw}
@keyframes stamp{from{opacity:0;transform:rotate(-8deg) scale(1.8)}}
.rise>*{animation:rise .7s cubic-bezier(.2,.8,.2,1) both}
.rise>*:nth-child(2){animation-delay:.15s}.rise>*:nth-child(3){animation-delay:.3s}.rise>*:nth-child(4){animation-delay:.45s}.rise>*:nth-child(5){animation-delay:.6s}
@keyframes rise{from{opacity:0;transform:translateY(1.4cqw)}}

/* opener */
.opener{justify-content:flex-end;padding-bottom:9cqw}
.opener .shock{margin:0;font:700 7.4cqw/1 var(--f-display);text-wrap:balance;max-width:50cqw;animation:slam .6s cubic-bezier(.2,1.3,.3,1) both}
@keyframes slam{from{opacity:.0;transform:scale(1.06)}}
.opener .legend{font-size:1.15cqw;color:var(--mute)}
.opener .sub{max-width:48cqw}
.opmap{position:absolute;inset:0 0 0 46%;z-index:2;mask-image:linear-gradient(90deg,transparent,#000 30%);-webkit-mask-image:linear-gradient(90deg,transparent,#000 30%)}
[dir=rtl] .opmap{inset:0 46% 0 0;mask-image:linear-gradient(270deg,transparent,#000 30%);-webkit-mask-image:linear-gradient(270deg,transparent,#000 30%)}
.opmap svg{width:100%;height:100%}

/* map */
.land{fill:#1a2430;stroke:rgba(239,231,214,.22);stroke-width:1}
.land.hl{fill:rgba(208,68,47,.3);stroke:rgba(255,120,95,.85)}
.clbl{font:500 14px var(--f-body);fill:rgba(239,231,214,.55);text-anchor:middle}
.clbl.sea{fill:rgba(93,159,219,.6);font-style:italic}
.pin .ring{fill:none;stroke-width:3;animation:ring 2s ease-out infinite;transform-box:fill-box;transform-origin:center}
.pin .core{stroke:var(--ground);stroke-width:3}
.pin text{font:700 13px var(--f-body);fill:var(--ground);text-anchor:middle;dominant-baseline:middle}
@keyframes ring{from{transform:scale(1);opacity:.9}to{transform:scale(2.6);opacity:0}}
.mapg{animation:zoomin 9s ease-out both}
@keyframes zoomin{from{transform:scale(1)}to{transform:scale(var(--z,1.2))}}
.mapscene{flex-direction:row;align-items:center;gap:3cqw}
.mapscene .mapbox{flex:0 0 44cqw;height:44cqw;max-height:100%;border:1px solid var(--line);border-radius:.6cqw;overflow:hidden;background:#0d141b}
.mapscene .mapbox svg{width:100%;height:100%}
.mapscene .col{display:grid;gap:1.6cqw;min-width:0}
.legendlist{list-style:none;margin:0;padding:0;display:grid;gap:1.1cqw}
.legendlist li{display:grid;grid-template-columns:2.4cqw 1fr;gap:1cqw;align-items:start;font-size:1.5cqw;line-height:1.4;animation:rise .6s both}
.legendlist i{width:2.4cqw;height:2.4cqw;border-radius:50%;background:var(--c);color:var(--ground);font:700 1.2cqw var(--f-body);font-style:normal;display:grid;place-items:center}

/* list */
.blist{list-style:none;margin:0;padding:0;display:grid;gap:1.2cqw;max-width:74cqw}
.blist li{position:relative;padding-inline-start:2.4cqw;font-size:1.8cqw;line-height:1.45}
.blist li::before{content:"";position:absolute;inset-inline-start:0;top:.75cqw;width:1cqw;height:1cqw;border-radius:50%;background:var(--c)}

/* state */
.state .hd{font-size:3.8cqw;max-width:76cqw}
.state .sub{font-size:2cqw;max-width:72cqw;border-inline-start:.3cqw solid var(--stamp);padding-inline-start:2cqw}

/* timeline */
.tl{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:1.6cqw;position:relative;padding-top:3.4cqw}
.tl::before{content:"";position:absolute;top:1cqw;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--line),var(--mute),var(--line))}
.tli{position:relative;display:grid;gap:.6cqw;align-content:start;animation:rise .6s both}
.tli::before{content:"";position:absolute;top:-3.05cqw;inset-inline-start:0;width:1.6cqw;height:1.6cqw;border-radius:50%;background:var(--c);box-shadow:0 0 0 .4cqw var(--ink),0 0 1.6cqw var(--c)}
.tli b{font:700 1.6cqw var(--f-display);color:var(--c)}
.tli span{font-size:1.45cqw;line-height:1.45}

/* numbers */
.pair{display:grid;grid-template-columns:1fr 1fr;gap:3cqw;max-width:80cqw}
.big{display:grid;gap:.6cqw;align-content:start;animation:rise .7s both}
.big b{font:700 7cqw/1 var(--f-display);color:var(--c);font-variant-numeric:tabular-nums;direction:ltr;text-align:start}
.big span{font-size:1.6cqw;line-height:1.4;max-width:34cqw}
.hook .bign{font:700 15cqw/0.95 var(--f-display);color:var(--stamp);font-variant-numeric:tabular-nums;direction:ltr;text-align:start}
[dir=rtl] .big b,[dir=rtl] .hook .bign{text-align:right}

/* bars */
.bars{display:grid;gap:1cqw;max-width:80cqw}
.bar{display:grid;grid-template-columns:24cqw 1fr;gap:1.4cqw;align-items:center;font-size:1.4cqw}
.bar .tr{height:2.6cqw;position:relative}
.bar .fill{height:100%;background:var(--c);width:var(--w);transform-origin:left;animation:grow 1.2s cubic-bezier(.2,.8,.2,1) both;border-radius:0 .3cqw .3cqw 0}
[dir=rtl] .bar .fill{transform-origin:right;border-radius:.3cqw 0 0 .3cqw}
.bar .v{position:absolute;top:50%;transform:translateY(-50%);inset-inline-start:calc(var(--w) + 1cqw);font:700 1.7cqw var(--f-display);white-space:nowrap;direction:ltr;unicode-bidi:isolate}
@keyframes grow{from{transform:scaleX(0)}}

/* split */
.split{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:1.6cqw}
.side{border:1px solid var(--line);border-top:.35cqw solid var(--c);background:rgba(18,25,32,.85);padding:1.6cqw 1.8cqw;border-radius:.4cqw;animation:rise .6s both}
.side b{display:block;font:700 1.9cqw var(--f-display);color:var(--c);margin-bottom:.6cqw}
.side p{margin:0;font-size:1.45cqw;line-height:1.5}

/* intro & end */
.intro{justify-content:center;align-items:flex-start;gap:1.6cqw}
.intro h2{margin:0;font:700 8.6cqw/1 var(--f-display)}
.intro .meta{display:flex;gap:2cqw;flex-wrap:wrap;font:500 1.25cqw var(--f-mono);color:var(--mute);letter-spacing:.06em}
[dir=rtl] .intro .meta{font-family:var(--f-body)}
.play-big{margin-top:1.4cqw;display:inline-flex;align-items:center;gap:1.2cqw;background:var(--stamp);color:#140806;border:0;border-radius:999px;padding:1.3cqw 2.8cqw 1.3cqw 2.2cqw;font:700 1.9cqw var(--f-display);cursor:pointer;box-shadow:0 0 0 0 rgba(255,75,53,.5);animation:pulse 2.4s infinite}
.play-big svg{width:2cqw;height:2cqw}
[dir=rtl] .play-big svg{transform:scaleX(-1)}
@keyframes pulse{70%{box-shadow:0 0 0 1.6cqw rgba(255,75,53,0)}100%{box-shadow:0 0 0 0 rgba(255,75,53,0)}}
.endc{align-items:flex-start}
.endc .sig{font:700 5cqw/1.2 var(--f-display)}
.endc .role{font-size:1.7cqw;color:var(--mute)}
.endc .row{display:flex;gap:1.2cqw;margin-top:1.4cqw;flex-wrap:wrap}
.endc .row button{font-size:1.5cqw;padding:.9cqw 2cqw;border-radius:999px;border:1px solid var(--line);background:var(--panel);cursor:pointer}

/* narrow stage: content sets the height */
@container (max-width:680px){
  .scene{position:relative;inset:auto;min-height:100cqw;padding:20cqw 5.5cqw 12cqw;gap:3.6cqw}
  .screen{aspect-ratio:auto}
  .mast{top:3.4cqw;right:3.4cqw;gap:2.2cqw}
  .mast b{font-size:3.4cqw}.mast i{font-size:2.6cqw}.mast img{width:10cqw;height:10cqw}
  .chtag{top:4.6cqw;font-size:2.6cqw}[dir=rtl] .chtag{font-size:3cqw}
  .chtag .t{display:none}
  .srcline{font-size:2.5cqw;bottom:3cqw;white-space:normal}
  .hd,.state .hd{font-size:6.6cqw;max-width:none}
  .kick,[dir=rtl] .kick{font-size:3cqw}
  .sub,.state .sub{font-size:3.9cqw;max-width:none}
  .stamp{position:relative;inset:auto;align-self:flex-start;font-size:4.4cqw;margin-top:1cqw}.stamp small{font-size:2.2cqw}
  .opener{padding-bottom:12cqw}
  .opener .shock{font-size:12.5cqw;max-width:none}
  .opener .legend{font-size:2.8cqw}
  .opmap,[dir=rtl] .opmap{inset:0;opacity:.45;mask-image:linear-gradient(180deg,#000 30%,transparent 85%);-webkit-mask-image:linear-gradient(180deg,#000 30%,transparent 85%)}
  .mapscene{flex-direction:column;align-items:stretch}
  .mapscene .mapbox{flex:none;width:100%;height:70cqw}
  .legendlist li{font-size:3.6cqw;grid-template-columns:5.4cqw 1fr;gap:2cqw}.legendlist i{width:5.4cqw;height:5.4cqw;font-size:2.8cqw}
  .blist li{font-size:4cqw;padding-inline-start:5cqw}.blist li::before{width:2.2cqw;height:2.2cqw;top:1.7cqw}
  .tl{grid-auto-flow:row;padding-top:0;padding-inline-start:6cqw;gap:3.6cqw}
  .tl::before{top:0;bottom:0;left:auto;right:auto;inset-inline-start:1.5cqw;width:2px;height:auto;background:var(--line)}
  .tli::before{top:.8cqw;inset-inline-start:-6cqw;width:3.4cqw;height:3.4cqw}
  .tli b{font-size:3.8cqw}.tli span{font-size:3.7cqw}
  .pair{grid-template-columns:1fr;gap:5cqw;max-width:none}
  .big b{font-size:15cqw}.big span{font-size:3.8cqw;max-width:none}
  .hook .bign{font-size:30cqw}
  .bars{gap:2.6cqw;max-width:none}
  .bar{grid-template-columns:1fr;gap:1cqw;font-size:3.4cqw}
  .bar .tr{height:5.6cqw;margin-inline-end:18cqw}.bar .v{font-size:3.8cqw}
  .split{grid-auto-flow:row}.side{padding:3.4cqw}.side b{font-size:4.4cqw}.side p{font-size:3.7cqw}
  .intro h2{font-size:15cqw}.intro .meta{font-size:3cqw}
  .play-big{font-size:4.6cqw;padding:3cqw 6cqw 3cqw 5cqw;gap:2.4cqw}.play-big svg{width:4.6cqw;height:4.6cqw}
  .endc .sig{font-size:10cqw}.endc .role{font-size:3.8cqw}.endc .row button{font-size:3.6cqw;padding:2.4cqw 4.4cqw}
}

/* controls */
.controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cbtn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--ink);display:grid;place-items:center;cursor:pointer}
.cbtn:hover{border-color:var(--mute)}
.cbtn.main{width:48px;height:48px;background:var(--bone);color:var(--ground);border-color:var(--bone)}
.cbtn svg{width:18px;height:18px}
[dir=rtl] .cbtn .flip{transform:scaleX(-1)}
.where{font-size:14px;color:var(--mute);min-width:0;flex:1}
.where b{color:var(--bone);font-weight:500}
@media (max-width:640px){.where{flex-basis:100%;order:9}}
.clock{direction:ltr;unicode-bidi:isolate;font:500 13px var(--f-mono);color:var(--mute);font-variant-numeric:tabular-nums}

/* chapter rail */
.rail{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
@media (max-width:640px){.rail{grid-template-columns:repeat(3,minmax(0,1fr))}}
.chap{border:0;background:none;padding:0;text-align:start;cursor:pointer;display:grid;gap:6px;min-width:0}
.segs{display:flex;gap:2px;height:5px}
.segs i{flex:1;background:var(--line);border-radius:1px;position:relative;overflow:hidden}
.segs i u{position:absolute;inset:0;background:var(--bone);transform-origin:left;transform:scaleX(var(--p,0))}
[dir=rtl] .segs i u{transform-origin:right}
.segs i.done u{--p:1}
.chap .n{font:500 11px var(--f-mono);color:var(--dim);letter-spacing:.1em}
.chap .t{font-size:13px;line-height:1.3;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chap.on .t{color:var(--bone)}.chap.on .n{color:var(--stamp)}
.chap:hover .t{color:var(--bone)}

/* notebook */
.book{background:var(--ink);border:1px solid var(--line);border-radius:6px;display:grid;grid-template-rows:auto 1fr;min-height:420px;position:sticky;top:max(12px,env(safe-area-inset-top,0px))}
@media (max-width:1020px){.book{position:static;min-height:0}}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;border:0;background:none;padding:12px 8px;cursor:pointer;color:var(--mute);font-weight:500;font-size:14px;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected=true]{color:var(--bone);border-bottom-color:var(--stamp)}
.tabs .cnt{font:500 11px var(--f-mono);background:var(--panel);border-radius:999px;padding:1px 7px;margin-inline-start:6px}
.pane{padding:18px 20px 22px;display:grid;gap:14px;align-content:start;min-width:0}
.who2{display:flex;gap:10px;align-items:center}
.who2 img{width:40px;height:40px;border-radius:50%;object-fit:cover;object-position:50% 15%;border:2px solid var(--stamp)}
.who2 b{display:block;font:700 15px var(--f-display)}
.who2 span{font-size:12px;color:var(--mute)}
.scene-ref{font:500 11px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
[dir=rtl] .scene-ref{font-family:var(--f-body);letter-spacing:0;font-size:12px}
.note{font-size:16.5px;line-height:1.65;margin:0;text-wrap:pretty}
.since{border:1px solid rgba(163,189,140,.35);background:rgba(163,189,140,.08);border-radius:4px;padding:10px 12px;font-size:14px;line-height:1.55}
.since b{display:block;font:500 11px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--us);margin-bottom:4px}
[dir=rtl] .since b{font-family:var(--f-body);letter-spacing:0;font-size:12px;font-weight:700}
.onscreen{font-size:13px;color:var(--mute);border-top:1px solid var(--line);padding-top:12px}
.srclist{margin:0;padding-inline-start:18px;display:grid;gap:8px;font-size:14px;line-height:1.45}
.srclist a{color:var(--bone);text-decoration-color:var(--dim);text-underline-offset:3px;word-break:break-word}
.srclist a:hover{text-decoration-color:var(--stamp)}
.muted{color:var(--mute);font-size:14px;margin:0}
.clist{display:grid;gap:12px;max-height:340px;overflow:auto;padding-inline-end:4px}
.cm{border-inline-start:2px solid var(--line);padding-inline-start:10px}
.cm .h{font-size:12px;color:var(--mute);display:flex;gap:8px;flex-wrap:wrap}
.cm .h b{color:var(--bone);font-weight:500}
.cm p{margin:2px 0 0;font-size:14.5px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}
form.cf{display:grid;gap:8px}
.cf input,.cf textarea{width:100%;background:var(--ground);border:1px solid var(--line);border-radius:4px;color:var(--bone);font:inherit;font-size:14.5px;padding:9px 11px}
.cf textarea{min-height:84px;resize:vertical}
.cf .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.cf .hint{font-size:12px;color:var(--dim)}
.cf button{border:0;background:var(--bone);color:var(--ground);border-radius:999px;padding:8px 18px;font-weight:700;cursor:pointer}
.cf button:disabled{opacity:.5;cursor:default}
.status{font-size:13px;color:var(--us);min-height:1em}
.status.err{color:var(--stamp)}

/* transcript */
.sheet{position:fixed;inset:0;z-index:50;background:rgba(5,8,11,.86);display:grid;place-items:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-bottom,0px))}
.sheet .in{background:var(--ink);border:1px solid var(--line);border-radius:6px;max-width:760px;width:100%;max-height:100%;overflow:auto;padding:24px 28px}
.sheet h2{margin:0 0 6px;font:700 24px var(--f-display)}
.sheet h3{margin:22px 0 6px;font:700 18px var(--f-display);color:var(--stamp)}
.sheet p{margin:0 0 10px;max-width:65ch}
.sheet .x{float:inline-end}
footer{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:var(--dim);font-size:13px;border-top:1px solid var(--line);padding-top:14px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important}}
</style>
</head>

<script>
const DATA={"fr":{"EPS":[{"id":"strike","name":"Frappe ou accord ?","open":{"fx":"radar","map":{"focus":[57,24],"zoom":1.25},"kick":"Mer d'Arabie · 24 octobre 2026","shock":"Frappe demain… ou accord","sub":"Trump : « La décision leur appartient ». La marine américaine se prépare.","stamp":"COMPTE À REBOURS","stampSmall":"Deux semaines décisives","src":"Iran International ; Gulf News"},"scenes":[{"t":"list","hd":"Les signaux d'une frappe","c":"var(--civ)","pts":["Le porte-avions George Washington reçoit des missiles de croisière et des bombes anti-bunker","Un second porte-avions, le Theodore Roosevelt, est dans la région","Diplomates et familles évacués du Liban, des Émirats, du Qatar et de Jordanie","L'émissaire Tom Barrack : « Une frappe cette semaine ? Absolument »"],"src":"Gulf News d'après le WSJ ; Iran International","stamp":"ALERTE","sy":"78%","sx":"36%","sr":"-8deg"},{"t":"list","hd":"Les signaux d'un accord","c":"var(--us)","pts":["Trump : « Ils veulent un accord, mais vont-ils le respecter ? La décision leur appartient »","Al Arabiya : Téhéran aurait dit au Pakistan être prêt à rouvrir Ormuz si le blocus est levé","Le président iranien Pezeshkian attendu à Moscou le 27 octobre"],"src":"Iran International, 24 octobre 2026"},{"t":"state","hd":"Téhéran dément : « pas d'Ormuz contre le blocus »","sub":"L'agence Tasnim, citant une source informée, dément toute nouvelle offre et qualifie le récit d'Al Arabiya de « mensonges et illusions ». Le message : aucune concession publique avant une frappe.","src":"Iran International d'après l'agence Tasnim","stamp":"DÉMENTI","sy":"74%","sx":"34%","sr":"8deg"},{"t":"timeline","hd":"Quatre dates qui pèsent sur la décision","items":[{"d":"19 octobre","tx":"Trump : pas d'attaque contre l'Iran avant les élections de mi-mandat","c":"var(--us)"},{"d":"24 octobre","tx":"Trump : « Nous pourrions frapper demain, ou conclure un accord »","c":"var(--civ)"},{"d":"27 octobre","tx":"Élections en Israël, Pezeshkian à Moscou","c":"var(--ua)"},{"d":"3 novembre","tx":"Élections de mi-mandat aux États-Unis","c":"var(--ru)"}],"src":"Al Jazeera, 19 octobre ; Iran International, 24 octobre","stamp":"CONTRADICTION","sy":"80%","sx":"30%","sr":"-8deg"},{"t":"state","hd":"Mon analyse : la menace est elle-même une arme de négociation","sub":"Deux porte-avions et l'évacuation des familles augmentent le coût d'un refus pour Téhéran avant tout nouveau round. Mais avec les élections israéliennes et américaines, les deux semaines à venir sont les plus dangereuses depuis la fin de la trêve.","src":"Analyse du chercheur","stamp":"ANALYSE","sy":"24%","sx":"40%","sr":"-10deg"}],"script":["Frappe demain, ou accord. C'est ainsi que Donald Trump a résumé, le 24 octobre au soir, l'avenir de la guerre avec l'Iran.","Les signaux d'une frappe sont clairs : le porte-avions George Washington reçoit des bombes anti-bunker, un second porte-avions est dans la région, et des diplomates quittent le Liban, les Émirats, le Qatar et la Jordanie. L'émissaire Tom Barrack l'assume : une frappe cette semaine ? Absolument.","Les signaux d'un accord existent aussi : Al Arabiya évoque une offre iranienne de rouvrir Ormuz contre la levée du blocus. Mais l'agence Tasnim dément et parle de mensonges.","Plus troublant : cinq jours plus tôt, Trump affirmait qu'il n'attaquerait pas l'Iran avant les élections de mi-mandat. Entre les élections israéliennes du 27 octobre et américaines du 3 novembre, s'ouvrent les deux semaines les plus dangereuses depuis la fin de la trêve.","Mon analyse : la menace est elle-même une arme de négociation. Frappe ou accord ? Donnez votre pronostic en commentaire."],"src":["iintl","gulf","aj19"]},{"id":"days","name":"240 jours","open":{"fx":"calendar","kick":"Du 28 février au 25 octobre 2026","shock":"240 jours de guerre","sub":"Dont seulement 91 sous une trêve fragile.","legend":"1 case = 1 jour · rouge : guerre · vert : trêve","stamp":"SANS FIN ?","stampSmall":"9e mois","src":"Wikipedia : cessez-le-feu de la guerre d'Iran 2026"},"scenes":[{"t":"timeline","hd":"Le début : une semaine qui a changé le Moyen-Orient","items":[{"d":"28 février","tx":"Opération « Epic Fury » : frappes américano-israéliennes, mort du guide suprême Ali Khamenei","c":"var(--civ)"},{"d":"28 février","tx":"Missiles iraniens sur Israël et les pays du Golfe, un site de la 5e Flotte touché à Bahreïn","c":"var(--ru)"},{"d":"Début mars","tx":"Fermeture d'Ormuz : environ 150 navires bloqués derrière le détroit","c":"var(--ru)"},{"d":"8 mars","tx":"Mojtaba Khamenei élu nouveau guide suprême","c":"var(--bone)"}],"src":"Wikipedia : chronologie de la guerre d'Iran 2026"},{"t":"timeline","hd":"La trêve qui n'a pas tenu","items":[{"d":"8 avril","tx":"Trêve de deux semaines sous médiation pakistanaise","c":"var(--us)"},{"d":"11–12 avril","tx":"21 heures de négociations à Islamabad, sans accord","c":"var(--bone)"},{"d":"13 avril","tx":"Blocus naval américain des ports iraniens","c":"var(--ua)"},{"d":"17 juin","tx":"Protocole d'accord et 60 jours pour un accord final","c":"var(--us)"},{"d":"8 juillet","tx":"Effondrement de la trêve après des attaques croisées","c":"var(--civ)"}],"src":"Wikipedia : cessez-le-feu ; blocus naval","stamp":"EFFONDREMENT","sy":"83%","sx":"28%","sr":"-6deg"},{"t":"list","hd":"Après la rupture : escalade sur tous les fronts","c":"var(--civ)","pts":["14 juillet : retour du blocus américain","9 septembre : plus grande vague d'attaques contre les navires depuis le début de la guerre","Septembre : l'AIEA saisit le Conseil de sécurité, par 23 voix contre 3","Octobre : les Houthis visent Riyad et des aéroports saoudiens"],"src":"Wikipedia ; Reuters via gCaptain ; AFP ; Gulf News"},{"t":"state","hd":"Mon analyse : chaque trêve était technique, pas politique","sub":"La trêve a arrêté le feu sans régler un seul dossier : ni le nucléaire, ni les avoirs gelés, ni le Liban. Elle s'est donc effondrée au premier test, et toute nouvelle trêve qui ignore ces dossiers connaîtra le même sort.","src":"Analyse du chercheur","stamp":"ANALYSE","sy":"24%","sx":"40%","sr":"-10deg"}],"script":["240 jours de guerre. Dont 91 seulement sous une trêve fragile.","Tout commence le 28 février : des frappes américano-israéliennes tuent le guide suprême Ali Khamenei. L'Iran riposte par des missiles sur Israël et les pays du Golfe, puis ferme le détroit d'Ormuz.","En avril, une trêve sous médiation pakistanaise. Mais 21 heures de négociations à Islamabad se terminent sans accord, et le blocus naval américain commence. En juin, un protocole d'accord, qui s'effondre le 8 juillet.","Suit une escalade sur tous les fronts : retour du blocus, navires visés, dossier nucléaire au Conseil de sécurité, Houthis contre l'Arabie saoudite.","Mon analyse : chaque trêve était technique, pas politique. Elle a arrêté le feu sans régler aucun dossier, c'est pourquoi elle s'est effondrée."],"src":["wtl","wcf","wbl","gcap","orient","gulf"]},{"id":"theater","name":"Le théâtre des opérations","open":{"fx":"scan","map":{"focus":[47,24],"zoom":1.1,"pins":[{"k":"hormuz","c":"var(--civ)"},{"ll":[35.5,33.9],"c":"var(--civ)"},{"k":"riyadh","c":"var(--ru)"},{"k":"sanaa","c":"var(--ru)"},{"k":"erbil","c":"var(--bone)"},{"k":"arab","c":"var(--ua)"}]},"kick":"De Beyrouth à la mer d'Arabie","shock":"Une guerre sans ligne de front","sub":"Le feu se répartit sur plusieurs théâtres à la fois.","stamp":"ESCALADE","src":"Carte : Natural Earth"},"scenes":[{"t":"map","hd":"Le Golfe : le cœur de l'affrontement","focus":[53,26.5],"zoom":1.55,"pins":[{"k":"hormuz","tx":"Détroit d'Ormuz : deux mines touchent deux superpétroliers chargés de 4,5 millions de barils","c":"var(--civ)"},{"k":"bahrain","tx":"Bahreïn : QG de la 5e Flotte, touché dès le premier jour","c":"var(--ua)"},{"k":"kharg","tx":"Île de Kharg : principal terminal pétrolier iranien, un pétrolier y a été visé","c":"var(--ru)"},{"k":"arab","tx":"Mer d'Arabie : le George Washington se prépare à frapper","c":"var(--ua)"},{"k":"tehran","tx":"Téhéran : « pas d'Ormuz contre le blocus »","c":"var(--civ)"}],"src":"Gulf News ; Wikipedia ; Iran International"},{"t":"map","hd":"Les théâtres périphériques","focus":[42,24],"zoom":1.05,"pins":[{"ll":[35.5,33.9],"tx":"Liban : plus de 4 300 morts depuis mars","c":"var(--civ)"},{"k":"erbil","tx":"Erbil : un drone frappe un camp de l'opposition kurde iranienne (24 octobre)","c":"var(--bone)"},{"k":"riyadh","tx":"Riyad : missile houthi intercepté à l'aube du 24 octobre","c":"var(--ru)"},{"k":"sanaa","tx":"Sanaa : frappes de la coalition, 11 morts selon les médias houthis","c":"var(--ru)"},{"ll":[45.03,12.8],"tx":"Aden : les Houthis bombardent l'aéroport (7 octobre)","c":"var(--ru)"}],"src":"Gulf News ; Iran International ; Reuters ; Wikipedia"},{"t":"pair","hd":"Les pays du Golfe dans la ligne de mire","items":[{"n":"≈ 50","t":"morts dans les pays du Golfe depuis le début de la guerre","c":"var(--civ)"},{"n":"6","t":"pays du Golfe touchés par des frappes iraniennes","c":"var(--ru)"}],"sub":"Koweït, Bahreïn, Émirats, Qatar, Arabie saoudite et Oman. Les Émirats comptent à eux seuls 15 morts et 246 blessés.","src":"Wikipedia : bilan humain ; chronologie"},{"t":"list","hd":"Yémen : la guerre est de retour","c":"var(--ru)","pts":["Les Houthis visent Riyad, Dammam, Najran et Khamis Mushait","Les forces gouvernementales contre-attaquent sur la côte de la mer Rouge, près de Bab el-Mandeb et de Mokha","La trêve onusienne de 2022 est de fait caduque, emportée par la guerre d'Iran"],"src":"Gulf News ; Reuters via Daily Maverick","stamp":"SECOND FRONT","sy":"78%","sx":"30%","sr":"-8deg"},{"t":"state","hd":"Mon analyse : le danger vient des marges, pas du centre","sub":"Chaque front secondaire peut entraîner tout le monde dans une escalade que personne ne veut. Un missile qui rate sa cible, ou une seule mine dans Ormuz, suffit à bouleverser tous les calculs.","src":"Analyse du chercheur","stamp":"ANALYSE","sy":"24%","sx":"40%","sr":"-10deg"}],"script":["De Beyrouth à la mer d'Arabie, une guerre sans ligne de front.","Dans le Golfe, cœur de l'affrontement : des mines dans le détroit d'Ormuz ont touché deux superpétroliers, la 5e Flotte est basée à Bahreïn, et le porte-avions George Washington croise en mer d'Arabie.","Sur les théâtres périphériques : plus de 4 300 morts au Liban, un drone près d'Erbil, des missiles houthis sur Riyad, des frappes sur Sanaa et un aéroport d'Aden bombardé.","Six pays du Golfe ont été touchés par des frappes iraniennes, avec une cinquantaine de morts. Et le Yémen est retombé dans la guerre après la trêve de 2022.","Mon analyse : le danger vient des marges, pas du centre. Un missile égaré ou une mine dans Ormuz peut tout changer."],"src":["gulf","iintl","wtl","wcas","yemen"]},{"id":"toll","name":"Le prix","open":{"fx":"toll","kick":"Depuis le 28 février 2026","shock":"Plus de 8 000 morts","sub":"Au Liban, en Iran, en Irak, en Israël et dans le Golfe, selon des bilans provisoires.","legend":"1 point = 20 morts · rouge : Liban · orange : Iran · blanc : autres pays","stamp":"BILAN PROVISOIRE","src":"Wikipedia : bilan humain de la guerre d'Iran 2026"},"scenes":[{"t":"bars","hd":"Les morts par pays (bilans provisoires)","max":4383,"rows":[{"lb":"Liban · ministère libanais de la Santé","v":4383,"txt":"4 383","c":"var(--civ)"},{"lb":"Iran · ONG HRANA (au 17 juillet)","v":3684,"txt":"3 684","c":"var(--ru)"},{"lb":"Irak","v":146,"txt":"146","c":"var(--bone)"},{"lb":"Israël (au 5 août)","v":72,"txt":"72","c":"var(--ua)"},{"lb":"Pays du Golfe","v":50,"txt":"≈ 50","c":"var(--us)"},{"lb":"Armée américaine · Pentagone","v":21,"txt":"21","c":"var(--ua)"}],"src":"Wikipedia : bilan humain ; The New Arab"},{"t":"hook","kick":"28 février · école de filles de Minab, sud de l'Iran","big":"180","sub":"morts selon les médias iraniens, après qu'un missile a frappé l'école dans les premières heures de la guerre.","src":"Wikipedia : chronologie de la guerre d'Iran 2026","stamp":"PREMIER JOUR","sy":"36%","sx":"40%","sr":"-10deg"},{"t":"pair","hd":"Liban : le front oublié","items":[{"n":"4 383","t":"morts selon le ministère libanais de la Santé","c":"var(--civ)"},{"n":"700 000","t":"déplacés en dix jours (HCR)","c":"var(--ru)"}],"sub":"Et plus de 12 000 blessés. Le Liban paie le plus lourd tribut humain d'une guerre dont il n'est pas un belligérant direct.","src":"Wikipedia : bilan humain ; chronologie"},{"t":"pair","hd":"Le coût de la guerre pour Washington","items":[{"n":"43,6","t":"milliards de dollars de coût militaire direct au 3 septembre (Pentagone)","c":"var(--us)"},{"n":"865","t":"soldats américains blessés, en plus de 21 morts","c":"var(--ua)"}],"sub":"Des estimations indépendantes dépassent 100 milliards de dollars en incluant les coûts indirects.","src":"WarCosts d'après le Pentagone et le CSIS ; The New Arab"},{"t":"pair","hd":"En Iran, une économie qui s'effondre","items":[{"n":"−6,1 %","t":"contraction prévue de l'économie en 2026 (FMI)","c":"var(--civ)"},{"n":"69 %","t":"inflation prévue en 2026 ; plus de 100 % sur l'alimentation","c":"var(--ru)"}],"sub":"Le rial a perdu environ 60 % de sa valeur depuis la guerre, et le prix des billets d'avion a bondi de 40 %.","src":"Statistics of the World d'après le FMI et la Banque centrale d'Iran ; Iran International","stamp":"EFFONDREMENT","sy":"79%","sx":"30%","sr":"6deg"},{"t":"state","hd":"Mon analyse : les victimes sont absentes de la table des négociations","sub":"Aucune des parties n'inscrit les victimes dans ses conditions. Les chiffres servent la propagande, pas le calcul politique, et c'est ce qui permet à la guerre de durer.","src":"Analyse du chercheur","stamp":"ANALYSE","sy":"24%","sx":"40%","sr":"-10deg"}],"script":["Plus de 8 000 morts depuis le 28 février, selon des bilans encore provisoires.","Le Liban en tête avec plus de 4 300 morts, puis l'Iran avec plus de 3 600, l'Irak, Israël, les pays du Golfe, et 21 soldats américains.","Dans les premières heures de la guerre, un missile a frappé une école de filles à Minab, dans le sud de l'Iran : 180 morts selon les médias iraniens.","Le Liban, front oublié, a vu 700 000 personnes fuir en dix jours. Washington a dépensé plus de 43 milliards de dollars, tandis que le FMI prévoit une contraction de 6 % de l'économie iranienne et près de 70 % d'inflation.","Mon analyse : les victimes sont absentes de la table des négociations. C'est pour cela que la guerre continue."],"src":["wcas","wtl","newarab","warcosts","imf","iintl"]},{"id":"blockades","name":"La guerre des blocus","open":{"fx":"strait","kick":"Détroit d'Ormuz · octobre 2026","shock":"Blocus contre blocus","sub":"Washington ferme les ports iraniens, Téhéran étrangle le détroit.","stamp":"ZONE INTERDITE","stampSmall":"Gardiens de la révolution","src":"Wikipedia ; AFP ; Gulf News"},"scenes":[{"t":"pair","hd":"Le blocus américain en chiffres","items":[{"n":"4,8","t":"milliards de dollars de pétrole perdus par l'Iran en 18 jours (Pentagone)","c":"var(--civ)"},{"n":"55","t":"navires déroutés depuis la reprise du blocus le 14 juillet","c":"var(--ua)"}],"sub":"Lancé le 13 avril, levé le 18 juin, rétabli le 14 juillet. Téhéran le qualifie de « piraterie » et d'« acte de guerre ».","src":"Wikipedia : blocus naval américain de l'Iran"},{"t":"hook","kick":"Navires ayant franchi Ormuz en 24 heures · 9 septembre 2026","big":"6","sub":"dans un passage par lequel transitait un cinquième du pétrole mondial. Le passage exige une autorisation et un droit de transit ; la zone interdite s'étend au golfe d'Oman et à la mer d'Arabie.","src":"Reuters via gCaptain ; AFP","stamp":"QUASI PARALYSÉ","sy":"36%","sx":"36%","sr":"-10deg"},{"t":"hook","kick":"Paradoxe · données Kpler début octobre","big":"18,5","sub":"millions de barils par jour : les exportations de brut du Moyen-Orient dépassent leur niveau d'avant-guerre (18 millions), via la mer Rouge, le golfe d'Oman et le couloir que surveille Washington.","src":"Al Jazeera / Reuters, 5 octobre 2026","stamp":"PARADOXE","sy":"36%","sx":"46%","sr":"-10deg"},{"t":"bars","hd":"Et pourtant : le prix du baril (dollars)","max":138,"rows":[{"lb":"27 février · veille de la guerre","v":71,"txt":"71","c":"var(--bone)"},{"lb":"7 avril · pic","v":138,"txt":"138","c":"var(--civ)"},{"lb":"29 mai · trêve","v":93,"txt":"93","c":"var(--us)"},{"lb":"24 octobre","v":117,"txt":"117","c":"var(--ru)"}],"src":"Politis ; Gulf News"},{"t":"split","hd":"Qui souffre le plus ?","sides":[{"c":"var(--civ)","b":"Téhéran","p":"Ses nouvelles exportations depuis le Golfe sont à l'arrêt, et le rial a perdu environ 60 % de sa valeur."},{"c":"var(--ua)","b":"Washington et le monde","p":"Un baril au-dessus de 110 dollars, et un diesel américain record, au-dessus de 5,94 dollars le gallon."},{"c":"var(--us)","b":"Le Golfe","p":"Les exportations ont retrouvé leur niveau par des routes alternatives, mais sous la menace des mines."}],"src":"Wikipedia d'après le WSJ ; Reuters ; Kpler"},{"t":"state","hd":"Mon analyse : le blocus américain fait plus mal, Ormuz gêne davantage le monde","sub":"Washington asphyxie la source de revenus de l'Iran, Téhéran fait grimper le coût de la guerre pour tous. « Ormuz contre le blocus » reste donc l'accord le plus logique, même si Téhéran le dément publiquement.","src":"Analyse du chercheur","stamp":"ANALYSE","sy":"24%","sx":"40%","sr":"-10deg"}],"script":["Blocus contre blocus. Washington ferme les ports iraniens, Téhéran étrangle le détroit d'Ormuz.","Le blocus américain a coûté à l'Iran 4,8 milliards de dollars de pétrole en 18 jours seulement, et dérouté 55 navires depuis juillet.","En face, un jour de septembre, seuls six navires ont franchi Ormuz.","Mais le paradoxe : les exportations de pétrole du Moyen-Orient ont retrouvé leur niveau d'avant-guerre par des routes alternatives. Et pourtant, le baril reste au-dessus de 110 dollars.","Mon analyse : le blocus américain fait plus mal à l'Iran, Ormuz gêne davantage le monde. C'est pourquoi l'équation Ormuz contre blocus reste l'accord le plus logique."],"src":["wbl","gcap","orient","kpler","politis","gulf"]},{"id":"next","name عل الأسبوعين القادمين الأخطر منذ انهيار الهدنة.","src":"تحليل الباحث","stamp":"تقديري","sy":"24%","sx":"40%","sr":"-10deg"}],"script":["ضربة غدًا، أو صفقة. هكذا لخّص ترامب مساء الرابع والعشرين من أكتوبر مصير الحرب مع إيران.","مؤشرات الضربة واضحة: حاملة الطائرات جورج واشنطن تُزوَّد بقنابل خارقة للتحصينات، وحاملة ثانية في المنطقة، ودبلوماسيون وعائلاتهم يغادرون لبنان والإمارات وقطر والأردن. والمبعوث توم باراك يقول: ضربة هذا الأسبوع؟ بالتأكيد.","ومؤشرات الصفقة حاضرة أيضًا: قناة العربية تتحدث عن استعداد إيراني لفتح هرمز إذا رُفع الحصار. لكن وكالة تسنيم تنفي وتصف الرواية بالأكاذيب.","والأغرب: قبل خمسة أيام فقط، قال ترامب إنه لن يهاجم إيران قبل الانتخابات النصفية. واليوم يتحدث عن ضربة غدًا. بين انتخابات إسرائيل في السابع والعشرين من أكتوبر والانتخابات الأمريكية في الثالث من نوفمبر، يبدأ أخطر أسبوعين منذ انهيار الهدنة.","تقديري: التهديد نفسه سلاح تفاوض. ضربة أم صفقة؟ اكتبوا توقعكم في التعليقات."],"src":["iintl","gulf","aj19"]},{"id":"days","name":"240 يومًا","open":{"fx":"calendar","kick":"من 28 فبراير إلى 25 أكتوبر 2026","shock":"240 يومًا من الحرب","sub":"91 يومًا منها فقط تحت هدنة هشّة.","legend":"كل مربع = يوم · أحمر: حرب · أخضر: هدنة","stamp":"بلا نهاية؟","stampSmall":"الشهر التاسع","src":"Wikipedia: وقف إطلاق النار في حرب إيران 2026"},"scenes":[{"t":"timeline","hd":"البداية: أسبوع غيّر الشرق الأوسط","items":[{"d":"28 فبراير","tx":"عملية «الغضب الملحمي»: ضربات أمريكية إسرائيلية ومقتل المرشد علي خامنئي","c":"var(--civ)"},{"d":"28 فبراير","tx":"صواريخ إيرانية على إسرائيل ودول الخليج، وإصابة مركز للأسطول الخامس في البحرين","c":"var(--ru)"},{"d":"مطلع مارس","tx":"إغلاق هرمز وتوقف نحو 150 سفينة شحن خلف المضيق","c":"var(--ru)"},{"d":"8 مارس","tx":"انتخاب مجتبى خامنئي مرشدًا جديدًا","c":"var(--bone)"}],"src":"Wikipedia: الخط الزمني لحرب إيران 2026"},{"t":"timeline","hd":"الهدنة التي لم تصمد","items":[{"d":"8 أبريل","tx":"هدنة أسبوعين بوساطة باكستان","c":"var(--us)"},{"d":"11–12 أبريل","tx":"21 ساعة من التفاوض في إسلام آباد دون اتفاق","c":"var(--bone)"},{"d":"13 أبريل","tx":"ح ز","sub":"كل جبهة فرعية قادرة على جرّ الجميع إلى تصعيد لا يريده أحد. صاروخ واحد يخطئ هدفه، أو لغم واحد في هرمز، يكفي لتغيير الحسابات كلها.","src":"تحليل الباحث","stamp":"تقديري","sy":"24%","sx":"40%","sr":"-10deg"}],"script":["من بيروت إلى بحر العرب، حرب بلا خط جبهة.","في الخليج، قلب المواجهة: ألغام في مضيق هرمز أصابت ناقلتين عملاقتين، والأسطول الخامس في البحرين، وحاملة الطائرات جورج واشنطن في بحر العرب.","وفي الساحات البعيدة: أكثر من أربعة آلاف وثلاثمائة قتيل في لبنان، ومسيّرة قرب أربيل، وصواريخ حوثية على الرياض، وغارات على صنعاء، وقصف لمطار عدن.","ست دول خليجية أصابتها ضربات إيرانية، ونحو خمسين قتيلًا فيها. واليمن عاد إلى الحرب بعد هدنة 2022.","تقديري: الخطر في الأطراف لا في المركز. صاروخ يخطئ هدفه أو لغم في هرمز قد يغيّر الحسابات كلها."],"src":["gulf","iintl","wtl","wcas","yemen"]},{"id":"toll","name":"الثمن","open":{"fx":"toll","kick":"منذ 28 فبراير 2026","shock":"أكثر من 8 آلاف قتيل","sub":"في لبنان وإيران والعراق وإسرائيل والخليج، وفق تقديرات غير نهائية.","legend":"كل نقطة = 20 قتيلًا · أحمر: لبنان · برتقالي: إيران · أبيض: باقي الدول","stamp":"حصيلة غير نهائية","src":"Wikipedia: حصيلة ضحايا حرب إيران 2026"},"scenes":[{"t":"bars","hd":"القتلى حسب البلد (تقديرات غير نهائية)","max":4383,"rows":[{"lb":"لبنان · وزارة الصحة اللبنانية","v":4383,"txt":"4,383","c":"var(--civ)"},{"lb":"إيران · منظمة هرانا (حتى 17 يوليو)","v":3684,"txt":"3,684","c":"var(--ru)"},{"lb":"العراق","v":146,"txt":"146","c":"var(--bone)"},{"lb":"إسرائيل (حتى 5 أغسطس)","v":72,"txt":"72","c":"var(--ua)"},{"lb":"دول الخليج","v":50,"txt":"≈ 50","c":"var(--us)"},{"lb":"الجيش الأمريكي · البنتاغون","v":21,"txt":"21","c":"var(--ua)"}],"src":"Wikipedia: حصيلة الضحايا؛ The New Arab"},{"t":"hook","kick":"28 فبراير · مدرسة للبنات في ميناب، جنوب إيران","big":"180","sub":"قتيلًا بحسب الإعلام الإيراني، بعد أن أصاب صاروخ المدرسة في الساعات الأولى للحرب.","src":"Wikipedia: الخط الزمني لحرب إيران 2026","stamp":"اليوم الأول","sy":"26%","sx":"44%","sr":"-10deg"},{"t":"pair","hd":"لبنان: الجبهة المنسية","items":[{"n  {fr:"Le Liban dépasse l'Iran : le pays le plus meurtri n'est aucune des deux parties principales. C'est la signature d'une guerre par procuration.",
  ar:"لبنان يتجاوز إيران: البلد الأكثر تضررًا ليس أحد الطرفين الرئيسيين. وهذه بصمة حرب بالوكالة."},
 {fr:"Les victimes civiles des premières heures nourrissent durablement le récit national iranien et rendent tout compromis politiquement plus coûteux.",
  ar:"الضحايا المدنيون في الساعات الأولى يغذّون السردية الوطنية الإيرانية طويلًا، ويجعلون كل تسوية أكثر كلفة سياسيًا."},
 {fr:"700 000 déplacés en dix jours : c'est la crise humanitaire la moins couverte de cette guerre, et celle qui durera le plus.",
  ar:"700 ألف نازح في عشرة أيام: أقل أزمات هذه الحرب تغطية، وأطولها أثرًا."},
 {fr:"Ce coût a pesé dans les urnes : selon les lectures du scrutin du 3 novembre, la hausse des prix liée à la guerre a compté dans la défaite républicaine.",
  ar:"هذه الكلفة حضرت في صناديق الاقتراع: بحسب قراءات نتائج 3 نوفمبر، أسهم ارتفاع الأسعار المرتبط بالحرب في هزيمة الجمهوريين."},
 {fr:"Une inflation alimentaire supérieure à 100 % fragilise le régime de l'intérieur : c'est précisément le levier que le blocus américain cherche à actionner.",
  ar:"تضخم غذائي يتجاوز 100% يُضعف النظام من الداخل، وهذه بالضبط الرافعة التي يسعى الحصار الأمريكي إلى تحريكها."},
 {fr:"Une paix durable devra inclure reconstruction et indemnisation, au Liban d'abord. Sinon, les victimes d'aujourd'hui feront les recrues de demain.",
  ar:"أي سلام دائم يجب أن يشمل إعادة الإعمار والتعويض، في لبنان أولًا. وإلا فضحايا اليوم هم مجنّدو الغد."}
],
blockades:[
 {fr:"Deux blocus qui se répondent créent un équilibre de la douleur : chacun parie que l'autre cédera le premier.",
  ar:"حصاران متقابلان يصنعان توازنًا للألم: كل طرف يراهن على أن الآخر سيتراجع أولًا."},
 {fr:"4,8 milliards en 18 jours, c'est environ 270 millions de dollars de recettes perdues chaque jour.",
  ar:"4.8 مليار دولار في 18 يومًا تعني نحو 270 مليون دولار من المداخيل الضائعة كل يوم."},
 {fr:"Ormuz n'est pas fermé, il est filtré : Téhéran a transformé le détroit en péage politique.",
  ar:"هرمز ليس مغلقًا بل مُصفّى: طهران حوّلت المضيق إلى بوابة عبور بشروط سياسية."},
 {fr:"Le marché s'est adapté plus vite que les diplomates : les routes alternatives réduisent le pouvoir de chantage d'Ormuz.",
  ar:"السوق تكيّف أسرع من الدبلوماسيين: المسارات البديلة تقلّص قدرة هرمز على الابتزاز."},
 {fr:"Quand l'offre revient mais que le prix reste haut, le marché paie une prime de risque : la peur d'un incident, pas la pénurie.",
  ar:"حين يعود العرض ويبقى السعر مرتفعًا، فالسوق يدفع علاوة مخاطر: الخوف من حادث، لا النقص."},
 {fr:"La souffrance est asymétrique : l'Iran perd ses revenus, le monde paie une prime. Or c'est le camp qui souffre le plus qui négocie sous contrainte.",
  ar:"الألم غير متكافئ: إيران تخسر مداخيلها، والعالم يدفع علاوة. والطرف الأكثر ألمًا هو من يفاوض تحت الضغط."},
 {fr:"La proposition transmise par le Qatar le 9 novembre suit exactement cette logique : réouverture d'Ormuz contre levée du blocus.",
  ar:"المقترح الذي نقلته قطر في 9 نوفمبر يسير وفق هذا المنطق تحديدًا: فتح هرمز مقابل رفع الحصار.",
  upd:{fr:"Au 9 novembre, Trump a confirmé que le blocus restait en place.",ar:"في 9 نوفمبر، أكّد ترامب أن الحصار باقٍ."}}
],
next:[
 {fr:"Trois scénarios ne sont pas trois prophéties : ce sont des grilles pour lire chaque nouvelle au moment où elle tombe.",
  ar:"ثلاثة سيناريوهات ليست ثلاث نبوءات، بل أدوات لقراءة كل خبر جديد لحظة وقوعه."},
 {fr:"Deux scrutins ont réduit la marge des faucons : un Netanyahou sans majorité, et un Congrès démocrate qui contrôlera l'autorisation de la guerre.",
  ar:"انتخابان قلّصا هامش الصقور: نتنياهو بلا أغلبية، وكونغرس ديمقراطي سيتحكم في تفويض الحرب."},
 {fr:"Les conditions iraniennes sont une position d'ouverture maximale : on demande beaucoup pour obtenir l'essentiel, ici la levée du blocus.",
  ar:"شروط إيران سقف تفاوضي أقصى: يُطلب الكثير للحصول على الأساس، وهو هنا رفع الحصار."},
 {fr:"Le plafond de 3,67 % est celui de l'accord de 2015 : Doha recycle une architecture connue, et c'est ce qui la rend crédible.",
  ar:"سقف 3.67% هو سقف اتفاق 2015: الدوحة تعيد استخدام بنية معروفة، وهذا ما يمنحها المصداقية."},
 {fr:"Le statu quo est le scénario par défaut : il n'exige aucune décision, mais il use l'économie iranienne et le marché mondial.",
  ar:"الوضع القائم هو السيناريو الافتراضي: لا يتطلب أي قرار، لكنه يستنزف الاقتصاد الإيراني والسوق العالمية."},
 {fr:"Le risque principal n'est pas une décision délibérée, mais un accident : une mine, un missile égaré, une initiative israélienne isolée.",
  ar:"الخطر الأكبر ليس قرارًا متعمدًا بل حادث: لغم، أو صاروخ طائش، أو تحرك إسرائيلي منفرد."},
 {fr:"Surveillez d'abord le deuxième indicateur : une réouverture, même partielle, d'Ormuz serait le signal le plus concret d'un accord.",
  ar:"راقبوا المؤشر الثاني أولًا: أي فتح لهرمز، ولو جزئيًا، سيكون أوضح إشارة إلى اتفاق."},
 {fr:"Mon pari : un accord d'étape, Ormuz contre le blocus, le dossier nucléaire étant renvoyé à une seconde phase sous supervision de l'AIEA.",
  ar:"رهاني: اتفاق مرحلي، هرمز مقابل الحصار، مع إرجاء الملف النووي إلى مرحلة ثانية تحت إشراف الوكالة الذرية."}
]};

const WORDS=v=>typeof v==="string"?v.trim().split(/\s+/).length:Array.isArray(v)?v.reduce((a,b)=>a+WORDS(b),0):(v&&typeof v==="object")?Object.entries(v).filter(([k])=>!["src","c","k","t","sx","sy","sr","focus","zoom","max","v","pins","map","fx"].includes(k)).reduce((a,[,b])=>a+WORDS(b),0):0;

  if(p.k==="open")return 9000;const base=2600+WORDS(sc)*330+(sc.t==="map"?3000:0)+(sc.t==="timeline"?1800:0);return Math.min(17000,Math.max(7500,base))}

/* ---------- map ---------- */
function mapSvg(o){const [fl,fb]=o.focus;const k=Math.cos(25*Math.PI/180);const fx=(fl-30)*k*20,fy=(42-fb)*20;
  const half=Math.min(MAP.W,MAP.H)/2.1;const vb=`${fx-half} ${fy-half} ${half*2} ${half*2}`;
  const land=MAP.paths.map(p=>`<path class="land${p.id==="Iran"?" hl":""}" d="${p.d}"/>`).join("");
  const lbl=Object.entries(MAP.P.lbl).map(([k2,[px,py]])=>`<text class="clbl${k2==="gulf"||k2==="arabsea"?" sea":""}" x="${px}" y="${py}">${esc(CL[lang][k2])}</text>`).join("");
  const pins=(o.pins||[]).map((p,i)=>{const [px,py]=p.ll?[(p.ll[0]-30)*k*20,(42-p.ll[1])*20]:MAP.P[p.k];return `<g class="pin"><circle class="ring" cx="${px}" cy="${py}" r="11" stroke="${p.c}" style="animation-delay:${i*.35}s"/><circle class="core" cx="${px}" cy="${py}" r="11" fill="${p.c}"/>${p.tx?`<text x="${px}" y="${py+1}">${i+1}</text>`:""}</g>`}).join("");
  return `<svg viewBox="${vb}" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><g class="mapg" style="--z:${o.zoom||1.2};transform-origin:${fx}px ${fy}px">${land}${lbl}${pins}</g></svg>`}
const STRAIT={focus:[56.4,26.2],zoom:1.9,pins:[{k:"hormuz",c:"var(--civ)"}]};

  else if(sc.t==="map"){cls+=" mapscene";h=`<div class="mapbox">${mapSvg(sc)}</div><div class="col"><h2 class="hd" style="animation:rise .6s both">${esc(sc.hd)}</h2><ol class="legendlist">${sc.pins.map((x,i)=>`<li style="--c:${x.c};animation-delay:${.6+i*.5}s"><i>${i+1}</i><span>${esc(x.tx)}</span></li>`).join("")}</ol></div>`}

  const el=$("scene");el.className=cls;el.innerHTML=h;
  $("srcline").textContent=sc.src?(lang==="ar"?"المصدر: ":"Source : ")+sc.src:"";
  const ch=p.ch>=0&&p.ch<6?DATA[lang].EPS[p.ch]:null;
  $("chtag").innerHTML=ch?`<b>${t.chapter} ${p.ch+1}/6</b><span class="t">${esc(ch.name)}</span>`:"";
  el.querySelectorAll("[data-count]").forEach(countUp);
  const L=$("launch");if(L)L.onclick=()=>{startAudio();play()};
  const R=$("replay");if(R)R.onclick=()=>{go(1);play()};
  const A=$("readall");if(A)A.onclick=openSheet;
  fxStart(p.k==="open"?sc.fx:p.k==="intro"?"intro":p.k==="end"?"intro":null);
}
function countUp(el){const raw=el.textContent;const m=raw.match(/\d[\d\s  .,]*\d|\d/);if(!m||matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const tok=m[0];let dec=0,sep="",dch="";const dm=tok.match(/[.,](\d{1,2})$/);if(dm){dec=dm[1].length;dch=tok[tok.length-dec-1]}
  const intPart=dec?tok.slice(0,tok.length-dec-1):tok;const sm=intPart.match(/\d([\s  .,])\d{3}/);if(sm)sep=sm[1];
  const target=parseFloat(intPart.replace(/[^\d]/g,"")+(dec?"."+dm[1]:""));if(!(target>=10)&&!dec)return;
  const fmt=v=>{let s=dec?v.toFixed(dec):String(Math.round(v));let [a,b]=s.split(".");if(sep)a=a.replace(/\B(?=(\d{3})+(?!\d))/g,sep);return b?a+dch+b:a};
  const st=performance.now(),D=1400;const f=now=>{const q=Math.min(1,(now-st)/D),e=1-Math.pow(1-q,3);el.textContent=raw.replace(tok,fmt(target*e));if(q<1&&el.isConnected)requestAnimationFrame(f)};requestAnimationFrame(f)}

/* ---------- canvas atmospheres ---------- */
const cv=$("fx"),cx=cv.getContext("2d");let fxName=null,fxT0=0,fxRaf=0;
const COL={stamp:"#ff4b35",civ:"#d0442f",ru:"#d9953a",ua:"#5d9fdb",us:"#a3bd8c",bone:"rgba(239,231,214,"};
function rng(s){return()=>{s=(s*16807)%2147483647;return(s-1)/2147483646}}
function fxStart(n){fxName=n;fxT0=performance.now();cancelAnimationFrame(fxRaf);if(!n||matchMedia("(prefers-reduced-motion: reduce)").matches){fxDraw(n?6:0);return}const loop=()=>{fxDraw((performance.now()-fxT0)/1000);fxRaf=requestAnimationFrame(loop)};loop()}
function fxDraw(t){const r=cv.getBoundingClientRect(),dpr=Math.min(2,devicePixelRatio||1);if(cv.width!==Math.round(r.width*dpr)){cv.width=Math.round(r.width*dpr);cv.height=Math.round(r.height*dpr)}
  const w=cv.width,h=cv.height;cx.clearRect(0,0,w,h);if(!fxName)return;const narrow=r.width<680;const rtl=lang==="ar";
  const X=(a)=>rtl?w-a:a; /* mirror for RTL so visuals sit opposite the text */
  if(fxName==="intro"||fxName==="winter"){const R=rng(7);for(let i=0;i<90;i++){const x0=R()*w,y0=R()*h,sp=.2+R()*.6,sz=(.6+R()*1.6)*dpr;const y=(y0+t*sp*20*dpr)%h,x=x0+Math.sin(t*.3+i)*8*dpr;cx.fillStyle=COL.bone+(.15+R()*.35)+")";cx.beginPath();cx.arc(x,y,sz,0,7);cx.fill()}
    if(fxName==="intro"){const g=cx.createRadialGradient(X(w*.78),h*.55,0,X(w*.78),h*.55,w*.45);g.addColorStop(0,"rgba(208,68,47,.22)");g.addColorStop(1,"rgba(208,68,47,0)");cx.fillStyle=g;cx.fillRect(0,0,w,h)}return}
  if(fxName==="radar"){const ccx=X(w*.72),ccy=h*.48,R0=Math.min(w,h)*.42;cx.strokeStyle="rgba(163,189,140,.25)";cx.lineWidth=1*dpr;for(let i=1;i<=4;i++){cx.beginPath();cx.arc(ccx,ccy,R0*i/4,0,7);cx.stroke()}
    const a=t*1.2;const g=cx.createConicGradient?cx.createConicGradient(a,ccx,ccy):null;if(g){g.addColorStop(0,"rgba(163,189,140,.35)");g.addColorStop(.12,"rgba(163,189,140,0)");g.addColorStop(1,"rgba(163,189,140,0)");cx.fillStyle=g;cx.beginPath();cx.arc(ccx,ccy,R0,0,7);cx.fill()}return}
  if(fxName==="scan"){const y=((t*.22)%1)*h;const g=cx.createLinearGradient(0,y-h*.12,0,y);g.addColorStop(0,"rgba(93,159,219,0)");g.addColorStop(1,"rgba(93,159,219,.22)");cx.fillStyle=g;cx.fillRect(0,y-h*.12,w,h*.12);cx.fillStyle="rgba(150,200,240,.7)";cx.fillRect(0,y,w,1.5*dpr);return}
  if(fxName==="strait"){return}
  if(fxName==="calendar"){const cols=narrow?20:24,n=240,area=narrow?w*.88:w*.38,cell=area/cols,left=narrow?w*.06:(rtl?w*.05:w*.57),top=narrow?h*.16:h*.2;const shown=Math.min(n,Math.floor(t/3.2*n));

addEventListener("resize",()=>{if(!playing)fxDraw((performance.now()-fxT0)/1000)});

/* ---------- side panel ---------- */
function noteFor(p){if(p.k==="intro")return {[lang]:T[lang].introNote};if(p.k==="end")return {[lang]:T[lang].endNote};return NOTES[IDS[p.ch]][p.i]}

  $("note-ref").textContent=t.analysis+" · "+refLabel(p);$("note").textContent=n[lang]||"";
  const s=$("since");if(n.upd){s.hidden=false;s.querySelector("span").textContent=n.upd[lang]}else s.hidden=true;

  $("src-list").innerHTML=ch?ch.src.map(k=>{const s2=DATA[lang].S[k];return s2?`<li><a href="${esc(s2[1])}" target="_blank" rel="noopener">${esc(s2[0])}</a></li>`:""}).join(""):"";

let COMS=[],cmode="off",db=null,usr=null,names={};
function renderComments(){const k=key(LINE[pos]),t=T[lang];const list=COMS.filter(c=>c.k===k).sort((a,b)=>a.at-b.at);
  $("ccount").textContent=list.length;const box=$("clist");
  if(cmode==="off"){box.innerHTML=`<p class="muted">${esc(t.comOff)}</p>`;$("cform").hidden=true;return}
  $("cform").hidden=false;$("c-name").hidden=cmode==="db";
  box.innerHTML=list.length?list.map(c=>`<div class="cm"><div class="h"><b>${esc(c.uid?(names[c.uid]||t.anon):(c.name||t.anon))}</b><span>${new Date(c.at).toLocaleDateString(lang==="ar"?"ar-MA":"fr-FR",{day:"numeric",month:"long"})}</span></div><p>${esc(c.text)}</p></div>`).join(""):`<p class="muted">${esc(t.noCom)}</p>`}
async function initComments(){
  if(window.claude&&window.claude.use){try{db=await window.claude.use("db");usr=await window.claude.use("user")}catch(e){db=null}
    if(db){cmode="db";const timer=setTimeout(()=>{if(!COMS.length){$("c-status").textContent=T[lang].loadErr;$("c-status").className="status err"}},10000);
      db.collection("comments").orderBy("at","asc").limit(800).onSnapshot(async snap=>{clearTimeout(timer);if(!snap.metadata||!snap.metadata.fromCache){$("c-status").textContent=""}
        COMS=snap.docs.map(d=>d.data());const ids=[...new Set(COMS.map(c=>c.uid).filter(Boolean))];
        if(usr&&ids.length){try{const ps=await usr.profiles(ids);ids.forEach(i=>names[i]=(ps[i]&&ps[i].name)||"")}catch(e){}}renderComments()},

    $("c-text").value="";st.textContent=t.sent}catch(e){st.textContent=t.sendErr;st.className="status err"}btn.disabled=false});

  document.querySelectorAll(".chap").forEach(b=>b.onclick=()=>{go(+b.dataset.go);if(!playing&&soundTouched)play()})}

/* ---------- share, fullscreen, transcript ---------- */
$("btn-share").onclick=async()=>{const url=location.href.split("#")[0]+"#"+key(LINE[pos]);const st=$("c-status");try{await navigator.clipboard.writeText(url);flash(T[lang].copied)}catch(e){flash(T[lang].copyFail+" "+url)}};
function flash(msg){const w=$("where");const old=w.innerHTML;w.textContent=msg;setTimeout(()=>where(),2600)}
$("btn-full").onclick=()=>{const s=$("stage");if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});else if(s.requestFullscreen)s.requestFullscreen().catch(()=>{})};
function openSheet(){pause();const t=T[lang];$("sheet-h").textContent=t.title;$("sheet-body").innerHTML=DATA[lang].EPS.map((e,c)=>`<h3>${t.chapter} ${c+1} · ${esc(e.name)}</h3>${e.script.map(s=>`<p>${esc(s)}</p>`).join("")}`).join("");$("sheet").hidden=false;$("sheet-x").focus()}
$("btn-script").onclick=openSheet;$("sheet-x").onclick=()=>$("sheet").hidden=true;$("sheet").onclick=e=>{if(e.target.id==="sheet")$("sheet").hidden=true};

/* ---------- language ---------- */
function applyLang(){const t=T[lang];document.documentElement.lang=lang;document.documentElement.dir=lang==="ar"?"rtl":"ltr";$("app").dir=lang==="ar"?"rtl":"ltr";$("sheet").dir=$("app").dir;
  document.querySelectorAll(".nm").forEach(el=>el.textContent=lang==="ar"?"حفيظ بوتشكوشت":"Hafid Boutchakkoucht");document.querySelectorAll("[data-t]").forEach(el=>el.textContent=t[el.dataset.t]);document.querySelectorAll("[data-ph]").forEach(el=>el.placeholder=t[el.dataset.ph]);
  $("title").textContent=t.title;$("updated").textContent=t.updated;$("foot-upd").textContent=t.updated;document.title=t.title;
  ["fr","ar"].forEach(l=>$("lang-"+l).setAttribute("aria-pressed",l===lang));
  ["prev","play","next","share","full"].forEach(k=>{const b=$("btn-"+k);if(b)b.setAttribute("aria-label",t[k])});
  buildRail();render(LINE[pos]);panel();where();updRail()}
document.querySelectorAll("[data-lang]").forEach(b=>b.onclick=()=>{lang=b.dataset.lang;try{localStorage.setItem("film-lang",lang)}catch(e){}applyLang()});

/* ---------- start ---------- */
function fromHash(){const h=location.hash.slice(1);const i=LINE.findIndex(p=>key(p)===h);return i}
addEventListener("hashchange",()=>{const i=fromHash();if(i>=0&&i!==pos)go(i,true)});
(function(){const i=fromHash();pos=i>=0?i:0;applyLang();setSnd();initComments()})();
</script>
